<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Moving truck travelling across the city with a tracked route">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="800" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1838"/>
      <stop offset="1" stop-color="#060E22"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="600" x2="1200" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#12233F"/>
      <stop offset="1" stop-color="#0A1730"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#F26522" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#F26522" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="truckbody" x1="250" y1="380" x2="250" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E7ECF4"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" rx="28" fill="url(#sky)"/>

  <!-- glow -->
  <circle cx="980" cy="170" r="260" fill="url(#sun)"/>
  <circle cx="980" cy="170" r="54" fill="#F26522"/>
  <circle cx="980" cy="170" r="54" fill="#0B1838" fill-opacity="0.06"/>

  <!-- dotted grid -->
  <g fill="#2A3A5C" fill-opacity="0.5">
    <circle cx="120" cy="120" r="3"/><circle cx="200" cy="120" r="3"/><circle cx="280" cy="120" r="3"/>
    <circle cx="120" cy="200" r="3"/><circle cx="200" cy="200" r="3"/><circle cx="360" cy="150" r="3"/>
    <circle cx="1080" cy="360" r="3"/><circle cx="1120" cy="300" r="3"/><circle cx="1040" cy="420" r="3"/>
  </g>

  <!-- skyline -->
  <g fill="#132444">
    <rect x="60" y="360" width="70" height="220" rx="6"/>
    <rect x="140" y="300" width="58" height="280" rx="6"/>
    <rect x="205" y="410" width="64" height="170" rx="6"/>
    <rect x="900" y="330" width="66" height="250" rx="6"/>
    <rect x="975" y="390" width="52" height="190" rx="6"/>
    <rect x="1035" y="290" width="72" height="290" rx="6"/>
    <rect x="1115" y="360" width="48" height="220" rx="6"/>
  </g>
  <g fill="#F26522" fill-opacity="0.5">
    <rect x="156" y="322" width="10" height="10" rx="2"/><rect x="176" y="322" width="10" height="10" rx="2"/>
    <rect x="156" y="352" width="10" height="10" rx="2"/><rect x="176" y="352" width="10" height="10" rx="2"/>
    <rect x="1051" y="312" width="10" height="10" rx="2"/><rect x="1073" y="312" width="10" height="10" rx="2"/>
    <rect x="1051" y="342" width="10" height="10" rx="2"/><rect x="1073" y="342" width="10" height="10" rx="2"/>
  </g>

  <!-- route -->
  <path d="M150 660 C 430 560, 620 700, 1000 470" stroke="#F26522" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 22" fill="none"/>
  <!-- destination pin -->
  <g transform="translate(1000 430)">
    <path d="M0 0c-26 0-46 20-46 45 0 30 46 73 46 73s46-43 46-73C46 20 26 0 0 0z" fill="#F26522"/>
    <circle cx="0" cy="45" r="17" fill="#FFFFFF"/>
  </g>

  <!-- road -->
  <path d="M0 640 Q 600 700 1200 660 L1200 800 L0 800 Z" fill="url(#road)"/>
  <path d="M60 690 h120 M260 700 h120 M470 704 h120 M690 700 h120 M910 690 h120" stroke="#F26522" stroke-opacity="0.45" stroke-width="6" stroke-linecap="round"/>

  <!-- stacked boxes -->
  <g transform="translate(560 500)">
    <rect x="0" y="60" width="96" height="86" rx="8" fill="#E7B27A"/>
    <rect x="0" y="60" width="96" height="86" rx="8" fill="#0B1838" fill-opacity="0.05"/>
    <path d="M0 88h96" stroke="#B9824A" stroke-width="4"/>
    <rect x="38" y="60" width="20" height="28" rx="3" fill="#B9824A"/>
    <rect x="18" y="0" width="80" height="70" rx="8" fill="#F0C48F"/>
    <path d="M18 24h80" stroke="#C9924F" stroke-width="4"/>
    <rect x="50" y="0" width="16" height="24" rx="3" fill="#C9924F"/>
  </g>

  <!-- truck -->
  <g transform="translate(150 360)">
    <!-- shadow -->
    <ellipse cx="270" cy="228" rx="250" ry="20" fill="#000000" fill-opacity="0.25"/>
    <!-- cargo -->
    <rect x="10" y="20" width="300" height="180" rx="16" fill="url(#truckbody)"/>
    <rect x="10" y="20" width="300" height="180" rx="16" stroke="#D3DAE6" stroke-width="2"/>
    <!-- brand stripe -->
    <rect x="10" y="150" width="300" height="50" rx="0" fill="#F26522"/>
    <path d="M10 200h300" stroke="#D2531A" stroke-width="3"/>
    <text x="34" y="185" font-family="'Segoe UI',Arial,sans-serif" font-size="30" font-weight="800" fill="#FFFFFF" letter-spacing="1">FAST<tspan fill="#0B1838">PACK</tspan></text>
    <!-- cab -->
    <path d="M310 60h84c11 0 21 6 27 15l45 70c3 5 5 11 5 17v38H310V60z" fill="#F26522"/>
    <path d="M310 60h84c11 0 21 6 27 15l45 70c3 5 5 11 5 17v38H310V60z" fill="#0B1838" fill-opacity="0.06"/>
    <!-- window -->
    <path d="M330 78h58c7 0 13 3 17 9l30 46h-105V78z" fill="#BFE0FF"/>
    <path d="M330 78h58c7 0 13 3 17 9l30 46h-105V78z" fill="#0B1838" fill-opacity="0.1"/>
    <!-- bumper + light -->
    <rect x="466" y="176" width="10" height="24" rx="3" fill="#0B1838"/>
    <rect x="452" y="150" width="14" height="16" rx="3" fill="#FFD37A"/>
    <!-- wheels -->
    <circle cx="90" cy="205" r="34" fill="#0B1838"/>
    <circle cx="90" cy="205" r="16" fill="#3A4C6B"/>
    <circle cx="360" cy="205" r="34" fill="#0B1838"/>
    <circle cx="360" cy="205" r="16" fill="#3A4C6B"/>
  </g>
</svg>
