<svg width="340" height="84" viewBox="0 0 340 84" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Fast Pack & Move">
  <!-- Icon tile -->
  <rect x="6" y="10" width="64" height="64" rx="16" fill="#0B1838"/>
  <rect x="6" y="10" width="64" height="64" rx="16" fill="url(#lg)" fill-opacity="0.18"/>
  <!-- motion lines -->
  <g stroke="#F26522" stroke-width="3" stroke-linecap="round">
    <line x1="12" y1="34" x2="24" y2="34"/>
    <line x1="10" y1="43" x2="20" y2="43"/>
    <line x1="13" y1="52" x2="22" y2="52"/>
  </g>
  <!-- truck -->
  <g>
    <rect x="24" y="30" width="24" height="20" rx="3" fill="#FFFFFF"/>
    <path d="M48 37h9.5c1 0 1.9.5 2.4 1.3L64 44v6H48V37z" fill="#F26522"/>
    <rect x="50.5" y="39.5" width="7" height="5.5" rx="1.2" fill="#0B1838"/>
    <circle cx="34" cy="52" r="5.2" fill="#0B1838" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="56" cy="52" r="5.2" fill="#0B1838" stroke="#FFFFFF" stroke-width="2"/>
  </g>
  <!-- Wordmark -->
  <text x="86" y="44" font-family="'Segoe UI',Arial,sans-serif" font-size="30" font-weight="800" letter-spacing="-0.5">
    <tspan fill="#0B1838">FAST</tspan><tspan fill="#F26522">PACK</tspan>
  </text>
  <text x="87" y="64" font-family="'Segoe UI',Arial,sans-serif" font-size="13.5" font-weight="700" letter-spacing="6" fill="#8DA0BE">&amp; MOVE</text>
  <defs>
    <linearGradient id="lg" x1="6" y1="10" x2="70" y2="74" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F26522"/>
      <stop offset="1" stop-color="#F26522" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>
