<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Fast Pack & Move — Packers and Movers in Hyderabad">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1838"/><stop offset="1" stop-color="#060E22"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#F26522" stop-opacity="0.5"/><stop offset="1" stop-color="#F26522" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1010" cy="150" r="260" fill="url(#glow)"/>

  <!-- logo mark -->
  <g transform="translate(80 70)">
    <rect width="72" height="72" rx="18" fill="#F26522"/>
    <g stroke="#fff" stroke-width="3.4" stroke-linecap="round" opacity="0.85"><line x1="8" y1="27" x2="22" y2="27"/><line x1="6" y1="37" x2="18" y2="37"/><line x1="9" y1="47" x2="20" y2="47"/></g>
    <rect x="24" y="24" width="26" height="22" rx="3" fill="#fff"/>
    <path d="M50 32h10c1 0 2 .5 2.6 1.4L67 39v7H50V32z" fill="#0B1838"/>
    <circle cx="34" cy="48" r="5.6" fill="#0B1838" stroke="#fff" stroke-width="2.2"/>
    <circle cx="59" cy="48" r="5.6" fill="#0B1838" stroke="#fff" stroke-width="2.2"/>
    <text x="90" y="34" font-family="'Segoe UI',Arial,sans-serif" font-size="34" font-weight="800"><tspan fill="#fff">FAST</tspan><tspan fill="#F26522">PACK</tspan></text>
    <text x="91" y="60" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="7" fill="#8DA0BE">&amp; MOVE</text>
  </g>

  <!-- headline -->
  <text x="80" y="285" font-family="'Segoe UI',Arial,sans-serif" font-size="72" font-weight="800" fill="#fff" letter-spacing="-1">Packers &amp; Movers</text>
  <text x="80" y="365" font-family="'Segoe UI',Arial,sans-serif" font-size="72" font-weight="800" letter-spacing="-1"><tspan fill="#fff">in Hyderabad who </tspan><tspan fill="#F26522">show up.</tspan></text>

  <!-- chips -->
  <g font-family="'Segoe UI',Arial,sans-serif" font-size="24" font-weight="600" fill="#DCE4F0">
    <g transform="translate(80 430)"><rect width="270" height="52" rx="26" fill="#12233F"/><circle cx="30" cy="26" r="7" fill="#F26522"/><text x="52" y="34">Insured transit</text></g>
    <g transform="translate(370 430)"><rect width="300" height="52" rx="26" fill="#12233F"/><circle cx="30" cy="26" r="7" fill="#F26522"/><text x="52" y="34">Fixed written price</text></g>
    <g transform="translate(690 430)"><rect width="270" height="52" rx="26" fill="#12233F"/><circle cx="30" cy="26" r="7" fill="#F26522"/><text x="52" y="34">Own fleet &amp; crew</text></g>
  </g>

  <!-- phone -->
  <text x="80" y="548" font-family="'Segoe UI',Arial,sans-serif" font-size="30" font-weight="700" fill="#fff">📞 +91 80963 86263</text>

  <!-- truck illustration top-right -->
  <g transform="translate(824 66)">
    <ellipse cx="150" cy="150" rx="150" ry="14" fill="#000" fill-opacity="0.3"/>
    <rect x="10" y="30" width="170" height="100" rx="10" fill="#F7F1E6"/>
    <rect x="10" y="98" width="170" height="32" fill="#F26522"/>
    <path d="M180 60h48c6 0 12 3 15 9l26 40c2 3 3 6 3 10v22H180V60z" fill="#F26522"/>
    <path d="M192 72h34c4 0 8 2 10 5l18 28h-62V72z" fill="#BFE0FF"/>
    <circle cx="60" cy="132" r="20" fill="#0B1838"/><circle cx="60" cy="132" r="9" fill="#3A4C6B"/>
    <circle cx="210" cy="132" r="20" fill="#0B1838"/><circle cx="210" cy="132" r="9" fill="#3A4C6B"/>
  </g>
</svg>
